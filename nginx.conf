server {
    listen 8000;

    # RunPod Load Balancer semble sonder cette route en interne pour
    # déterminer si le worker est prêt à recevoir du trafic, indépendamment
    # du "Health check path" configuré dans la console (/api/health).
    # OllamaDiffuser n'exposant pas /ping, on le simule ici.
    location /ping {
        default_type text/plain;
        return 200 'pong';
    }

    # Tout le reste est transmis tel quel au serveur OllamaDiffuser,
    # qui écoute en interne sur 127.0.0.1:8001.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Génération d'image + upload d'image source (img2img) :
        # laisser de la marge pour des fichiers volumineux et des
        # temps de traitement longs.
        client_max_body_size 200m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
